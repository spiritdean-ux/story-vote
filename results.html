<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票結果</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f7f3ed;color:#241f1b;margin:0}.wrap{max-width:760px;margin:auto;padding:50px 20px}h1{font-size:38px}.card{background:#fff;border-radius:20px;padding:25px;margin:18px 0;box-shadow:0 10px 30px #0000000d}.row{display:flex;justify-content:space-between;gap:15px;font-weight:700}.bar{height:14px;background:#eee3d8;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#8a3f2d;width:0}.muted{color:#776d65}</style></head><body><main class="wrap"><h1>投票結果</h1><p class="muted" id="total">載入中…</p><div id="cards"></div></main><script>fetch('/api/results').then(r=>r.json()).then(d=>{document.getElementById('total').textContent='目前共 '+d.total+' 票';document.getElementById('cards').innerHTML=d.stories.map(s=>`<div class="card"><div class="row"><span>${s.title}</span><span>${s.votes} 票・${s.percentage}%</span></div><div class="bar"><div class="fill" style="width:${s.percentage}%"></div></div></div>`).join('')}).catch(()=>document.getElementById('total').textContent='目前無法載入結果');</script></body></html>
